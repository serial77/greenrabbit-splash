<title>The Green Rabbit — Cannabis Social Club · Calpe</title>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  min-height: 100vh;
  background: #0a1a1f;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: 'Inter', sans-serif;
  color: #e8dcc8;
  overflow: hidden;
}

/* Subtle radial glow behind the image */
.glow {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -55%);
  width: 600px;
  height: 600px;
  background: radial-gradient(circle, rgba(62, 207, 142, 0.08) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

.container {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 2rem;
  max-width: 500px;
}

.logo-img {
  width: 320px;
  max-width: 80vw;
  height: auto;
  margin-bottom: 2.5rem;
  filter: drop-shadow(0 0 40px rgba(62, 207, 142, 0.15));
  animation: fadeIn 1.5s ease-out;
}

h1 {
  font-size: 1.1rem;
  font-weight: 600;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: #e8dcc8;
  margin-bottom: 0.6rem;
  text-align: center;
  animation: fadeIn 2s ease-out 0.3s both;
}

.subtitle {
  font-size: 0.85rem;
  font-weight: 300;
  letter-spacing: 0.15em;
  color: rgba(232, 220, 200, 0.5);
  text-align: center;
  margin-bottom: 3rem;
  animation: fadeIn 2s ease-out 0.6s both;
}

.coming-soon {
  font-size: 0.75rem;
  font-weight: 400;
  letter-spacing: 0.5em;
  text-transform: uppercase;
  color: #3ecf8e;
  padding: 0.6rem 2rem;
  border: 1px solid rgba(62, 207, 142, 0.3);
  border-radius: 99px;
  animation: fadeIn 2s ease-out 0.9s both;
}

.divider {
  width: 40px;
  height: 1px;
  background: rgba(62, 207, 142, 0.3);
  margin: 2rem 0;
  animation: fadeIn 2s ease-out 1.2s both;
}

.location {
  font-size: 0.7rem;
  font-weight: 300;
  letter-spacing: 0.2em;
  color: rgba(232, 220, 200, 0.3);
  text-transform: uppercase;
  animation: fadeIn 2s ease-out 1.5s both;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Mobile */
@media (max-width: 480px) {
  .logo-img { width: 260px; }
  h1 { font-size: 0.95rem; }
}
</style>
